# Reusable fpk build. Called by release.yml (manual dispatch). Produces
# per-arch fpk artifacts; publishing is the caller's job.
#
# Each matrix leg is self-contained (source/frontend/wheels/kernel/resources
# all assembled per-arch by scripts/assemble-payload.sh, cached under cache/).
# fnpack comes from the official static binary (no npm needed).
name: build-fpk

on:
  workflow_call:
    inputs:
      appver:
        required: true
        type: string
      upstream:
        required: true
        type: string
      archs:
        required: false
        type: string
        default: '["x86_64"]'

env:
  FNPACK_VERSION: '1.2.3'

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
        include:
          - arch: x86_64
            runner: ubuntu-latest
            fnpack_platform: linux-amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            fnpack_platform: linux-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-${{ matrix.fnpack_platform }}"
          chmod +x /usr/local/bin/fnpack

      # uv 版本钉死：上游 pyproject required-version == 0.12.5，版本不符 uv
      # 会拒绝执行 export（assemble-payload.sh 依赖它从上游 uv.lock 导出依赖）
      - name: Install uv
        run: pip install "uv==0.12.5"

      - name: Build fpk (${{ matrix.arch }})
        env:
          MP_ARCHS: ${{ matrix.arch }}
          MP_APPVER: ${{ inputs.appver }}
          MP_UPSTREAM: ${{ inputs.upstream }}
        # tee 留全量日志供补丁清单提取；pipefail 保证 build.sh 失败仍使步骤失败
        run: |
          set -o pipefail
          bash ./build.sh "$MP_UPSTREAM" 2>&1 | tee build.log

      # 补丁 applied/skipped 清单（assemble-payload.sh 的 [payload] 日志行），
      # 独立 artifact——auto-follow 的 Release body 消费，不混入 fpk 产物
      - name: Extract patch report
        if: always()
        run: |
          mkdir -p patch-report
          grep -E '补丁|上游已|前端' build.log > "patch-report/patches-${{ matrix.arch }}.txt" \
            || echo "（构建未产出补丁日志）" > "patch-report/patches-${{ matrix.arch }}.txt"
          cat "patch-report/patches-${{ matrix.arch }}.txt"

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patch-report-${{ matrix.arch }}
          path: patch-report/*
          if-no-files-found: warn

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v7
        with:
          name: moviepilot-fpk-${{ matrix.arch }}
          path: dist/*.fpk
          if-no-files-found: error
